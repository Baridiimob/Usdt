<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شراء USDT عبر بريدي موب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 95%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo img {
            max-width: 100px;
        }
        h2 {
            text-align: center;
            color: #0d9488;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-weight: 700;
            margin-bottom: 5px;
            color: #374151;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }
        input[type="submit"] {
            background-color: #0d9488;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #0f766e;
        }
        .note, .rate-box {
            background: #ecfdf5;
            color: #065f46;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
        }
        .rate-box {
            background: #fff7ed;
            color: #7c2d12;
            border: 1px solid #fdba74;
        }
    </style>
    <script>
        function calculateUSDT() {
            const rate = 1 / 245;
            const amountDZD = document.querySelector('input[name="amount_dzd"]').value;
            const usdtAmount = (amountDZD * rate).toFixed(4);
            document.getElementById("usdt_result").innerText = usdtAmount + ' USDT';
        }

        function calculateDZD() {
            const rate = 245;
            const usdtInput = document.querySelector('input[name="usdt_amount"]').value;
            const dzdAmount = (usdtInput * rate).toFixed(2);
            document.getElementById("dzd_result").innerText = dzdAmount + ' دج';
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="usdt-logo.png" alt="USDT Logo">
        </div>
        <h2>شراء USDT (BEP20)</h2>

        <div class="rate-box">
            سعر الصرف: <strong>1 USDT = 245 دج</strong><br>
            الكمية المقدرة: <span id="usdt_result">0 USDT</span><br>
            المبلغ المطلوب: <span id="dzd_result">0 دج</span>
        </div>

        <form method="POST" action="submit_order.php" enctype="multipart/form-data" oninput="calculateUSDT(); calculateDZD();">
            <label>المبلغ بالدينار الجزائري</label>
            <input type="number" name="amount_dzd" required>

            <label>كمية USDT المراد شراؤها</label>
            <input type="number" step="0.0001" name="usdt_amount">

            <label>رقم الهاتف</label>
            <input type="text" name="phone" required>

            <label>محفظتك BEP20</label>
            <input type="text" name="bep20_address" required>

            <label>إيصال التحويل (اختياري)</label>
            <input type="file" name="receipt">

            <input type="submit" value="إرسال الطلب">
        </form>

        <div class="note">
            الرجاء تحويل المبلغ إلى رقم بريدي موب <strong>00799999002709037546</strong>، ثم إرسال الطلب. سيتم التحقق يدوياً من التحويل وإرسال USDT إلى محفظتك.
        </div>
    </div>
</body>
</html>
